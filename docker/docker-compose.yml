version: "3.9"
services:
  http_ok:
    image: nginx:alpine
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 5s
      timeout: 2s
      retries: 15
  mocks:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    image: npc-mocks:dev
    ports:
      - "8000:8000"
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nagios-plugins-collection:dev
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["bash", "-lc"]
    working_dir: /app
    depends_on:
      http_ok:
        condition: service_healthy
      mocks:
        condition: service_started
    command: |
      "pytest -q && echo 'OK'"
  tests:
    extends:
      service: app
    command: |
      "pytest -q --cov=src --cov-report=term-missing"
