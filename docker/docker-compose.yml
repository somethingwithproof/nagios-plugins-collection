services:
  http_ok:
    image: nginx:alpine
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 5s
      timeout: 2s
      retries: 15
  mocks:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    image: npc-mocks:dev
  wiremock:
    image: wiremock/wiremock:latest
    volumes:
      - ./mocks/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nagios-plugins-collection:dev
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: []
    working_dir: /app
    depends_on:
      http_ok:
        condition: service_healthy
      mocks:
        condition: service_healthy
    command: ["check_website_status", "--help"]
  tests:
    extends:
      service: app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tests
    image: nagios-plugins-collection-tests:dev
    command: ["pytest", "-q", "--cov=nagios_plugins", "--cov-report=term-missing", "--cov-fail-under=80"]
