version: "3.9"
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nagios-plugins-collection:dev
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["bash", "-lc"]
    working_dir: /app
    command: |
      "pytest -q && echo 'OK'"
  tests:
    extends:
      service: app
    command: |
      "pytest -q --cov=src --cov-report=term-missing"
