[tox]
envlist =
    py{311,312,313,314}
    lint
    type
    docs
    coverage
    security
isolated_build = True
skip_missing_interpreters = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
extras = dev,aws,dns,k8s,pg,redis
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    httpx>=0.26.0
    rich>=13.7.0
commands =
    # Run tests with pytest
    pytest {posargs:tests} -v --junitxml=test-reports/junit-{envname}.xml
setenv =
    COVERAGE_FILE = .coverage.{envname}
    PYTHONWARNINGS = ignore::DeprecationWarning:distutils,ignore::DeprecationWarning:pkg_resources

[testenv:lint]
deps =
    ruff>=0.6.0
commands =
    ruff check .
    ruff format --check src tests

[testenv:type]
deps =
    mypy>=1.7.0
    pydantic>=2.5.0
commands =
    mypy src

[testenv:docs]
deps =
    sphinx>=7.2.0
    sphinx-rtd-theme>=1.3.0
    docstr-coverage>=2.2.0
    myst-parser>=2.0.0
commands =
    sphinx-build -b html docs/source docs/build/html
    docstr-coverage src --fail-under=95

[testenv:coverage]
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
commands =
    pytest --cov=src --cov-report=xml --cov-report=term --cov-report=html {posargs:tests}

[testenv:security]
deps =
    bandit>=1.7.5
    pip-audit>=2.10.0
commands =
    bandit -r src/ -c pyproject.toml --severity-level medium
    pip-audit --local

[flake8]
max-line-length = 100
exclude = .tox,*.egg,build,data
select = E,W,F
extend-ignore = E203,W503,E501
