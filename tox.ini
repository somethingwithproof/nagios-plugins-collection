[tox]
envlist = py{312,313}, lint, type
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=8.0.0
    pytest-cov>=5.0.0
    httpx>=0.26.0
    rich>=13.7.0
commands =
    pytest {posargs:tests} -v

[testenv:lint]
deps = ruff>=0.9.0
commands =
    ruff check .
    ruff format --check .

[testenv:type]
deps =
    mypy>=1.7.0
    pydantic>=2.5.0
commands =
    mypy src
