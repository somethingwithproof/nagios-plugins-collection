[tox]
envlist =
    py{311,312,313,314}
    lint
    type
    docs
    coverage
    security
isolated_build = True
skip_missing_interpreters = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
skip_install = true
deps = -r{toxinidir}/packaging/ci-requirements.txt
install_command = python -I -m pip install --only-binary=:all: --require-hashes {opts} {packages}
commands_pre = python -m pip install --no-deps --no-build-isolation --only-binary=:all: {toxinidir}
commands =
    # Run tests with pytest
    pytest {posargs:tests} -v --junitxml=test-reports/junit-{envname}.xml
setenv =
    COVERAGE_FILE = .coverage.{envname}
    PYTHONWARNINGS = ignore::DeprecationWarning:distutils,ignore::DeprecationWarning:pkg_resources

[testenv:lint]
commands =
    ruff check .
    ruff format --check src tests

[testenv:type]
commands =
    mypy src

[testenv:docs]
commands =
    sphinx-build -W -b html docs/source docs/build/html
    docstr-coverage src --fail-under=95

[testenv:coverage]
commands =
    pytest --cov=nagios_plugins --cov-report=xml --cov-report=term --cov-report=html {posargs:tests}

[testenv:security]
commands =
    bandit -r src/ -c pyproject.toml --severity-level medium
    pip-audit --local

[flake8]
max-line-length = 100
exclude = .tox,*.egg,build,data
select = E,W,F
extend-ignore = E203,W503,E501
