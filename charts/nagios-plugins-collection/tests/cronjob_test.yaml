suite: CronJob renders
templates:
  - templates/cronjob.yaml
values:
  - ../values.yaml

tests:
  - it: uses provided schedule
    set:
      schedule: "0 * * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "0 * * * *"

  - it: sets image repository and tag
    set:
      image:
        repository: ghcr.io/example/repo
        tag: v1
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/example/repo:v1

  - it: pins the image by digest when one is given
    set:
      image:
        repository: ghcr.io/example/repo
        tag: v1
        digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/example/repo@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: defaults the tag to the chart appVersion without a digest
    chart:
      appVersion: 9.9.9
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/somethingwithproof/nagios-plugins-collection:9.9.9

  - it: rejects a malformed digest
    set:
      image:
        digest: sha256:abc
    asserts:
      - failedTemplate:
          errorPattern: "image.digest must be sha256: followed by 64 lowercase hex digits"

  - it: passes command and args
    set:
      command: ["check_website_status", "--url=https://example.com"]
      args: ["--pattern=Example"]
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value:
            - check_website_status
            - --url=https://example.com
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value:
            - --pattern=Example

  - it: does not retry or overlap check runs
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 0
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.jobTemplate.spec.ttlSecondsAfterFinished
          value: 86400

  - it: defaults the image tag to the chart appVersion
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/somethingwithproof/nagios-plugins-collection:2.0.1  # x-release-please-version

  - it: renders literal env values and secretKeyRef sources
    set:
      env:
        - name: PYTHONUNBUFFERED
          value: 1
        - name: CHECK_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-monitor
              key: client-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          value:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CHECK_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth-monitor
                  key: client-secret
