image:
  repository: ghcr.io/somethingwithproof/nagios-plugins-collection
  tag: "2.0.0"
  pullPolicy: IfNotPresent

schedule: "*/10 * * * *"  # every 10 minutes

command: ["check_website_status", "--url=https://example.com", "--pattern=Example"]

env: []
args: []
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
affinity: {}
tolerations: []
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
rbac:
  create: false  # Opt in to list-only node monitoring permissions
