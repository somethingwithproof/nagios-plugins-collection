name: Nagios Plugins Collection CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly run on Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

# Cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}



# Minimal permissions by default
permissions:
  contents: read

jobs:
  semantic-pr:
    name: Semantic PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        uses: rhysd/actionlint@v1

  helm-validate:
    name: Helm unit tests and kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
      - name: Helm lint
        run: |
          helm lint charts/nagios-plugins-collection
      - name: Run helm-unittest
        run: |
          helm unittest charts/nagios-plugins-collection --strict
      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="0.6.7"
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
      - name: Kubeconform validate rendered manifests
        run: |
          helm template charts/nagios-plugins-collection \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0
      - name: Kube-linter policy checks
        run: |
          set -euo pipefail
          VERSION=v0.6.8
          curl -sSL -o kube-linter.tar.gz https://github.com/stackrox/kube-linter/releases/download/${VERSION}/kube-linter-linux.tar.gz
          tar -xzf kube-linter.tar.gz
          sudo mv kube-linter /usr/local/bin/
          helm template charts/nagios-plugins-collection > rendered.yaml
          kube-linter lint rendered.yaml
  test:
    name: Test Python ${{ matrix.python-version }} with Nagios ${{ matrix.nagios-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        nagios-version: ['4.4.6', '4.4.7', '4.4.8', '4.4.9', '4.4.10']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Test with tox
      run: tox

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}-nagios${{ matrix.nagios-version }}
        path: test-reports/
        retention-days: 7

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox pre-commit

    - name: Run linting via tox
      run: tox -e lint

    - name: Run pre-commit hooks (ruff, black, isort, misc)
      run: pre-commit run --all-files --show-diff-on-failure

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run type checking
        run: tox -e type

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build documentation
        run: tox -e docs

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/build/html/
          retention-days: 7

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run coverage
        run: tox -e coverage

      - name: Enforce coverage threshold (80%)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          rate = float(root.attrib.get('line-rate', '0'))
          thr = 0.80
          print(f"line-rate={rate:.3f} threshold={thr:.2f}")
          import sys; sys.exit(0 if rate >= thr else 1)
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  container:
    name: Build, scan, sign, and push container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write  # required for keyless signing with cosign
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:latest
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign container images with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          for TAG in latest ${{ github.sha }}; do
            cosign sign --yes ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${TAG}
          done
      - name: Generate SBOM file (syft CLI)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }} -o spdx-json=sbom.spdx.json
      - name: Attest SBOM with Cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Generate simple SLSA provenance predicate
        run: |
          cat > provenance.json <<'JSON'
          {
            "_type": "https://slsa.dev/provenance/v1",
            "subject": [{
              "name": "ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection",
              "digest": {"sha256": "${{ github.sha }}"}
            }],
            "buildType": "https://github.com/actions",
            "builder": {"id": "https://github.com/actions"},
            "invocation": {"configSource": {"uri": "${{ github.repository }}@${{ github.ref }}"}},
            "metadata": {"buildStartedOn": "${{ github.run_started_at }}"}
          }
          JSON
      - name: Attest provenance with Cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes \
            --predicate provenance.json \
            --type slsaprovenance \
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit
        run: bandit -r src/ -c pyproject.toml

      - name: Run safety
        run: safety check

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --no-banner

      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          hide-progress: true
          format: table
          severity: HIGH,CRITICAL

  e2e:
    name: E2E (docker-compose FastAPI mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app and mocks images
        run: docker compose -f docker/docker-compose.yml build app mocks
      - name: Start mock services
        run: docker compose -f docker/docker-compose.yml up -d http_ok mocks
      - name: Wait for http_ok to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{json .State.Health.Status}}' $(docker compose -f docker/docker-compose.yml ps -q http_ok))" = '"healthy"' ]; then
              echo "http_ok healthy"; exit 0; fi; sleep 2; done; echo "timeout"; docker compose -f docker/docker-compose.yml ps; exit 1
      - name: Run HTTP SLI check against mock
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_http_sli --url=http://http_ok --samples 3 --warning 0.3 --critical 1.0
      - name: Run OAuth2 token check against mocks
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_oauth2_token --token-url http://mocks:8000/token --client-id id --client-secret secret --scope openid --scope profile
      - name: Run Prometheus query OK against mocks
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_prometheus_query --server http://mocks:8000 --query up --warning 1 --critical 2
      - name: Run Prometheus query WARNING against mocks (expect exit 1)
        run: |
          set +e
          docker compose -f docker/docker-compose.yml run --rm app \
            check_prometheus_query --server http://mocks:8000 --query warn --warning 1 --critical 2
          ec=$?; if [ "$ec" -ne 1 ]; then echo "expected exit 1, got $ec"; exit 1; fi
      - name: Run Prometheus query CRITICAL against mocks (expect exit 2)
        run: |
          set +e
          docker compose -f docker/docker-compose.yml run --rm app \
            check_prometheus_query --server http://mocks:8000 --query errors --warning 1 --critical 2
          ec=$?; if [ "$ec" -ne 2 ]; then echo "expected exit 2, got $ec"; exit 1; fi
      - name: Run Elasticsearch log errors OK against mocks
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_log_errors --endpoint http://mocks:8000/es --index logs --minutes 1 --query "errors" --warning 1 --critical 10
      - name: Run Elasticsearch log errors WARNING against mocks (expect exit 1)
        run: |
          set +e
          docker compose -f docker/docker-compose.yml run --rm app \
            check_log_errors --endpoint http://mocks:8000/es --index logs --minutes 1 --query "errors some" --warning 1 --critical 10
          ec=$?; if [ "$ec" -ne 1 ]; then echo "expected exit 1, got $ec"; exit 1; fi
      - name: Run Elasticsearch log errors CRITICAL against mocks (expect exit 2)
        run: |
          set +e
          docker compose -f docker/docker-compose.yml run --rm app \
            check_log_errors --endpoint http://mocks:8000/es --index logs --minutes 1 --query "errors many" --warning 1 --critical 10
          ec=$?; if [ "$ec" -ne 2 ]; then echo "expected exit 2, got $ec"; exit 1; fi
      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  e2e-wiremock:
    name: E2E (docker-compose WireMock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app image
        run: docker compose -f docker/docker-compose.yml build app
      - name: Start WireMock
        run: docker compose -f docker/docker-compose.yml up -d wiremock
      - name: Wait for WireMock to be healthy
        run: |
          for i in $(seq 1 40); do
            if [ "$(docker inspect -f '{{json .State.Health.Status}}' $(docker compose -f docker/docker-compose.yml ps -q wiremock))" = '"healthy"' ]; then
              echo "wiremock healthy"; exit 0; fi; sleep 2; done; echo "timeout"; docker compose -f docker/docker-compose.yml ps; exit 1
      - name: Run OAuth2 token check against WireMock
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_oauth2_token --token-url http://wiremock:8080/token --client-id id --client-secret secret --scope openid --scope profile
      - name: Run Prometheus OK/WARN/CRIT against WireMock
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_prometheus_query --server http://wiremock:8080 --query up --warning 1 --critical 2
          set +e
          docker compose -f docker/docker-compose.yml run --rm app \
            check_prometheus_query --server http://wiremock:8080 --query warn --warning 1 --critical 2; ec=$?; [ "$ec" -eq 1 ] || { echo "expected 1"; exit 1; }
          docker compose -f docker/docker-compose.yml run --rm app \
            check_prometheus_query --server http://wiremock:8080 --query errors --warning 1 --critical 2; ec=$?; [ "$ec" -eq 2 ] || { echo "expected 2"; exit 1; }
      - name: Run ES OK/WARN/CRIT against WireMock
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_log_errors --endpoint http://wiremock:8080/es --index logs --minutes 1 --query "errors" --warning 1 --critical 10
          set +e
          docker compose -f docker/docker-compose.yml run --rm app \
            check_log_errors --endpoint http://wiremock:8080/es --index logs --minutes 1 --query "errors some" --warning 1 --critical 10; ec=$?; [ "$ec" -eq 1 ] || { echo "expected 1"; exit 1; }
          docker compose -f docker/docker-compose.yml run --rm app \
            check_log_errors --endpoint http://wiremock:8080/es --index logs --minutes 1 --query "errors many" --warning 1 --critical 10; ec=$?; [ "$ec" -eq 2 ] || { echo "expected 2"; exit 1; }
      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  license:
    name: License allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install project and pip-licenses
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install .
      - name: Generate licenses and enforce allowlist
        run: |
          pip-licenses --format=json --with-urls --with-license-file > licenses.json
          python - <<'PY'
          import json, sys
          allowed = {
            'MIT License','MIT','Apache 2.0','Apache-2.0','BSD 3-Clause','BSD-3-Clause','BSD License','ISC','Python Software Foundation License'
          }
          bad = []
          with open('licenses.json') as f:
            data = json.load(f)
          for pkg in data:
            lic = pkg.get('License', '').strip()
            if lic and all(a not in lic for a in allowed):
              bad.append((pkg.get('Name'), lic))
          if bad:
            print('Disallowed licenses found:')
            for n,l in bad:
              print(f' - {n}: {l}')
            sys.exit(1)
          print('All licenses allowed')
          PY

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    needs: [test, lint, type-check, docs, coverage, security, docker-lint, workflow-lint, helm-validate, e2e, e2e-wiremock, license]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: packages
        path: dist/
        retention-days: 30
