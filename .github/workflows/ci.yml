name: Nagios Plugins Collection CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly run on Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

# Cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}



# Minimal permissions by default
permissions:
  contents: read

jobs:
  helm-validate:
    name: Helm unit tests and kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
      - name: Run helm-unittest
        run: |
          helm unittest charts/nagios-plugins-collection --strict
      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="0.6.7"
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
      - name: Kubeconform validate rendered manifests
        run: |
          helm template charts/nagios-plugins-collection \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0
  test:
    name: Test Python ${{ matrix.python-version }} with Nagios ${{ matrix.nagios-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        nagios-version: ['4.4.6', '4.4.7', '4.4.8', '4.4.9', '4.4.10']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Test with tox
      run: tox

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}-nagios${{ matrix.nagios-version }}
        path: test-reports/
        retention-days: 7

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox pre-commit

    - name: Run linting via tox
      run: tox -e lint

    - name: Run pre-commit hooks (ruff, black, isort, misc)
      run: pre-commit run --all-files --show-diff-on-failure

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run type checking
        run: tox -e type

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build documentation
        run: tox -e docs

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/build/html/
          retention-days: 7

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run coverage
        run: tox -e coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  container:
    name: Build, scan, sign, and push container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write  # required for keyless signing with cosign
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:latest
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign container images with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          for TAG in latest ${{ github.sha }}; do
            cosign sign --yes ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${TAG}
          done

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit
      run: bandit -r src/ -c pyproject.toml

    - name: Run safety
      run: safety check

  e2e:
    name: E2E (docker-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app image
        run: docker compose -f docker/docker-compose.yml build app
      - name: Start mock services
        run: docker compose -f docker/docker-compose.yml up -d http_ok
      - name: Wait for mock to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{json .State.Health.Status}}' $(docker compose -f docker/docker-compose.yml ps -q http_ok))" = '"healthy"' ]; then
              echo "http_ok healthy"; exit 0; fi; sleep 2; done; echo "timeout"; docker compose -f docker/docker-compose.yml ps; exit 1
      - name: Run HTTP SLI check against mock
        run: |
          docker compose -f docker/docker-compose.yml run --rm app \
            check_http_sli --url=http://http_ok --samples 3 --warning 0.3 --critical 1.0
      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    needs: [test, lint, type-check, docs, coverage, security, helm-validate, e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: packages
        path: dist/
        retention-days: 30
