name: Nagios Plugins Collection CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly run on Sunday at midnight
  workflow_dispatch:  # Allow manual triggering

# Cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}



# Minimal permissions by default
permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} with Nagios ${{ matrix.nagios-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    strategy:
      fail-fast: false
      matrix:
python-version: ['3.11', '3.12', '3.13']
        nagios-version: ['4.4.6', '4.4.7', '4.4.8', '4.4.9', '4.4.10']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Test with tox
      run: tox

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}-nagios${{ matrix.nagios-version }}
        path: test-reports/
        retention-days: 7

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox pre-commit

    - name: Run linting via tox
      run: tox -e lint

    - name: Run pre-commit hooks (ruff, black, isort, misc)
      run: pre-commit run --all-files --show-diff-on-failure

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run type checking
      run: tox -e type

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Build documentation
      run: tox -e docs

    - name: Upload documentation
      uses: actions/upload-artifact@v6
      with:
        name: documentation
        path: docs/build/html/
        retention-days: 7

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run coverage
      run: tox -e coverage

- name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  container:
    name: Build, scan, and push container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:latest
            ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nagios-plugins-collection:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit
      run: bandit -r src/ -c pyproject.toml

    - name: Run safety
      run: safety check

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs
    needs: [test, lint, type-check, docs, coverage, security]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: packages
        path: dist/
        retention-days: 30
