---
# Squash merges use the PR title as the commit subject, and Release Please
# derives the next version and the changelog from those subjects, so every
# title must be a Conventional Commit. Editing the title re-runs the check.
name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  semantic-pr:
    name: Semantic PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Keep in step with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            revert
            build
            docs
            refactor
            test
            ci
            style
            chore
          requireScope: false
