---
name: Release
# Release Please calls this workflow after it tags a merged release PR; a tag
# pushed by hand does not publish. workflow_dispatch republishes an existing
# version from main, or with dry-run builds, attests and verifies the source
# version's artifacts on any branch without publishing anything.
on:
  workflow_call:
    inputs:
      version:
        description: Complete SemVer matching the project source version
        required: true
        type: string
      release-exists:
        description: Release Please already created the GitHub release and its notes
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Complete SemVer matching the project source version
        required: true
        type: string
      dry-run:
        description: Build, attest and verify provenance only; publish no release or image tag
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate source and release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install locked release tools
        env:
          UV_PYTHON: '3.12'
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --only-group build
      - name: Validate version and immutable tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run == true }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          uv run --no-sync python scripts/release_artifacts.py validate --version "$version"
          # A dry run publishes nothing, so it may test a review branch.
          if [[ "$DRY_RUN" == true ]]; then
            exit 0
          fi
          # Provenance records this ref; verify_release_provenance.py expects it.
          test "$GITHUB_REF" = refs/heads/main
          if git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor HEAD origin/main
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      # Without a release version CI neither tags nor promotes the image.
      release-version: ${{ inputs.dry-run != true && needs.version.outputs.version || '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
  publish:
    name: Publish verified SemVer artifacts
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Attest public release artifacts
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.private == false
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify_release_provenance.py
          sparse-checkout-cone-mode: false
          path: source
      - name: Verify the attestations as the Python publishing workflow will
        if: github.event.repository.private == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 source/scripts/verify_release_provenance.py
          --source-ref "$GITHUB_REF" --source-commit "$GITHUB_SHA" release/*
      - name: Publish GitHub release
        if: inputs.dry-run != true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # Release Please writes the notes from the Conventional Commits.
          generate_release_notes: ${{ !inputs.release-exists }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release/*
