name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}



# Minimal permissions by default
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hung jobs

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover Python projects with setup.py
        id: discover
        run: |
          echo "projects=$(find . -type f -name 'setup.py' -exec dirname {} \; | paste -sd ' ' -)" >> $GITHUB_OUTPUT

      - name: Run tests
        run: |
          for project in ${{ steps.discover.outputs.projects }}; do
            echo "Testing $project"
            cd "$project"
            pytest || exit 1
            cd - > /dev/null
          done
