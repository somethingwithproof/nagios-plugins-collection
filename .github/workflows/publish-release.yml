name: Publish Release (multi-destination)

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Where to publish"
        required: true
        type: choice
        options: ["pypi", "testpypi", "github-packages"]
        default: "pypi"
      dry-run:
        description: "Build and check only (no upload)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ github.event.inputs.destination }}
      dry: ${{ github.event.inputs.dry-run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 14

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.dry == 'false' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to PyPI
        if: ${{ needs.build.outputs.destination == 'pypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload dist/*
      - name: Publish to TestPyPI
        if: ${{ needs.build.outputs.destination == 'testpypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*
      - name: Publish to GitHub Packages
        if: ${{ needs.build.outputs.destination == 'github-packages' }}
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload --repository-url https://pypi.pkg.github.com/${{ github.repository_owner }} dist/*
