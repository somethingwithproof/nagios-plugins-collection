name: Publish verified Python release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Where to publish"
        required: true
        type: choice
        options: ["pypi", "testpypi"]
        default: "pypi"
      dry-run:
        description: "Build and check only (no upload)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "true"

permissions:
  # Read the source and download the GitHub release assets.
  contents: read

# One upload per destination at a time; a second run waits instead of racing.
concurrency:
  group: publish-${{ github.event.inputs.destination }}
  cancel-in-progress: false

env:
  UV_PYTHON: '3.12'
  UV_PYTHON_DOWNLOADS: never

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ github.event.inputs.destination }}
      dry: ${{ github.event.inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
          # The release also carries other .tar.gz assets; select the Python
          # distributions by their normalized project name.
          DIST: nagios_plugins_collection
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          uv sync --locked --only-group build
          version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-sync python scripts/release_artifacts.py validate --version "$version"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "$DIST-*.whl" --pattern "$DIST-*.tar.gz" --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
          # The Release workflow builds on main, so its provenance records
          # refs/heads/main; the tag binds it to the released commit.
          commit="$(git rev-parse "refs/tags/v$version^{commit}")"
          python3 scripts/verify_release_provenance.py --source-commit "$commit" \
            dist/"$DIST"-*.whl dist/"$DIST"-*.tar.gz
          uv run --no-sync twine check dist/"$DIST"-*.whl dist/"$DIST"-*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-artifacts
          # Only the distributions: the publish action rejects any other file.
          path: |
            dist/nagios_plugins_collection-*.whl
            dist/nagios_plugins_collection-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to ${{ needs.build.outputs.destination }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.dry == 'false' }}
    environment:
      name: ${{ needs.build.outputs.destination }}
      url: ${{ needs.build.outputs.destination == 'pypi' && 'https://pypi.org/p/nagios-plugins-collection' || 'https://test.pypi.org/p/nagios-plugins-collection' }}
    permissions:
      # Trusted publishing: PyPI exchanges this job's OIDC token for a
      # short-lived upload token. No long-lived API token is stored.
      id-token: write
    steps:
      - name: Require a registered trusted publisher
        env:
          DESTINATION: ${{ needs.build.outputs.destination }}
          TRUSTED_PUBLISHING: ${{ vars.TRUSTED_PUBLISHING }}
        run: |
          if [[ "$TRUSTED_PUBLISHING" != true ]]; then
            host=pypi.org
            [[ "$DESTINATION" == testpypi ]] && host=test.pypi.org
            echo "::error title=Trusted publishing is not configured::Register a (pending) trusted publisher on https://$host/manage/account/publishing/ with owner $GITHUB_REPOSITORY_OWNER, repository ${GITHUB_REPOSITORY#*/}, workflow publish-release.yml and environment $DESTINATION, then set the variable TRUSTED_PUBLISHING=true on the $DESTINATION environment. Nothing was uploaded."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to PyPI
        if: ${{ needs.build.outputs.destination == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: ${{ needs.build.outputs.destination == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
