name: Publish Release (multi-destination)

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Where to publish"
        required: true
        type: choice
        options: ["pypi", "testpypi", "github-packages"]
        default: "pypi"
      dry-run:
        description: "Build and check only (no upload)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    outputs:
      destination: ${{ github.event.inputs.destination }}
      dry: ${{ github.event.inputs.dry-run }}
    steps:
      - \18e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Set up Python
        \183679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload artifacts
        \1b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 14

  publish:
    runs-on: [self-hosted, linux, x64]
    needs: build
    if: ${{ needs.build.outputs.dry == 'false' }}
    steps:
      - \1d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to PyPI
        if: ${{ needs.build.outputs.destination == 'pypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload dist/*
      - name: Publish to TestPyPI
        if: ${{ needs.build.outputs.destination == 'testpypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*
      - name: Publish to GitHub Packages
        if: ${{ needs.build.outputs.destination == 'github-packages' }}
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload --repository-url https://pypi.pkg.github.com/${{ github.repository_owner }} dist/*
