name: Publish verified Python release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Where to publish"
        required: true
        type: choice
        options: ["pypi", "testpypi"]
        default: "pypi"
      dry-run:
        description: "Build and check only (no upload)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "true"

permissions:
  contents: read

env:
  UV_PYTHON: '3.12'
  UV_PYTHON_DOWNLOADS: never

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ github.event.inputs.destination }}
      dry: ${{ github.event.inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          uv sync --locked --only-group build
          version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-sync python scripts/release_artifacts.py validate --version "$version"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
          for artifact in dist/*.whl dist/*.tar.gz; do
            test -f "$artifact"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/v$version" --deny-self-hosted-runners
          done
          uv run --no-sync twine check dist/*.whl dist/*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 14

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.dry == 'false' }}
    environment: ${{ needs.build.outputs.destination }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to PyPI
        if: ${{ needs.build.outputs.destination == 'pypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv sync --locked --only-group build
          uv run --no-sync twine upload dist/*.whl dist/*.tar.gz
      - name: Publish to TestPyPI
        if: ${{ needs.build.outputs.destination == 'testpypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          uv sync --locked --only-group build
          uv run --no-sync twine upload --repository-url https://test.pypi.org/legacy/ dist/*.whl dist/*.tar.gz
