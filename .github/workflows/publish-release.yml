name: Publish verified Python release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Where to publish"
        required: true
        type: choice
        options: ["pypi", "testpypi"]
        default: "pypi"
      dry-run:
        description: "Build and check only (no upload)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ github.event.inputs.destination }}
      dry: ${{ github.event.inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.txt
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release_artifacts.py validate --version "$version"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
          for artifact in dist/*.whl dist/*.tar.gz; do
            test -f "$artifact"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/v$version" --deny-self-hosted-runners
          done
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 14

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.dry == 'false' }}
    environment: ${{ needs.build.outputs.destination }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to PyPI
        if: ${{ needs.build.outputs.destination == 'pypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.txt
          python -m twine upload dist/*.whl dist/*.tar.gz
      - name: Publish to TestPyPI
        if: ${{ needs.build.outputs.destination == 'testpypi' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.txt
          python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*.whl dist/*.tar.gz
