version: 2
updates:
- package-ecosystem: pip
  directories:
  - /
  - /docker/mocks
  schedule:
    interval: daily
    time: '04:00'
    timezone: UTC
  open-pull-requests-limit: 10
  versioning-strategy: increase
  # myst-parser 5.1 requires docutils <0.23; update them together when supported.
  ignore:
  - dependency-name: docutils
    versions: [">=0.23"]
  # aiohttp 3.14 requires multidict <7; reconsider with a compatible aiohttp.
  - dependency-name: multidict
    versions: [">=7.0.0"]
  # Pydantic pins its core exactly; keep the pair in one dependency update.
  groups:
    pydantic:
      patterns:
      - pydantic
      - pydantic-core
  rebase-strategy: auto
  labels:
  - dependencies
  - python
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: '04:10'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - ci
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: docker
  directories:
  - /docker
  - /docker/mocks
  schedule:
    interval: daily
    time: '04:20'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - docker
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: docker-compose
  directory: /docker
  schedule:
    interval: daily
    time: '04:30'
    timezone: UTC
  commit-message:
    prefix: chore
    include: scope
  groups:
    docker-compose-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: daily
    time: '04:40'
    timezone: UTC
  commit-message:
    prefix: chore
    include: scope
  groups:
    pre-commit-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
