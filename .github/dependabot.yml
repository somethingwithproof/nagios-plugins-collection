version: 2
updates:
- package-ecosystem: uv
  directory: /
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: '04:00'
    timezone: UTC
  open-pull-requests-limit: 10
  versioning-strategy: increase
  # myst-parser 5.1 requires docutils <0.23; update them together when supported.
  ignore:
  - dependency-name: docutils
    versions: [">=0.23"]
  # aiohttp 3.14 requires multidict <7; reconsider with a compatible aiohttp.
  - dependency-name: multidict
    versions: [">=7.0.0"]
  # botocore requires python-dateutil <3.0.0; reconsider when botocore allows it.
  - dependency-name: python-dateutil
    versions: [">=3.0.0"]
  # Pydantic pins its core exactly; keep the pair in one dependency update.
  groups:
    pydantic:
      patterns:
      - pydantic
      - pydantic-core
  rebase-strategy: auto
  labels:
  - dependencies
  - python:uv
  commit-message:
    prefix: chore
    include: scope
# The E2E mock server is not part of the uv project; it keeps a pip-compiled lock.
- package-ecosystem: pip
  directory: /docker/mocks
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: '04:05'
    timezone: UTC
  open-pull-requests-limit: 10
  rebase-strategy: auto
  labels:
  - dependencies
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: '04:10'
    timezone: UTC
  open-pull-requests-limit: 10
  groups:
    actions:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: docker
  directories:
  - /docker
  - /docker/mocks
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: '04:20'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: pre-commit
  directory: /
  cooldown:
    default-days: 7
  schedule:
    interval: daily
    time: '04:40'
    timezone: UTC
  labels:
  - dependencies
  - pre_commit
  commit-message:
    prefix: chore
    include: scope
  groups:
    pre-commit-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
