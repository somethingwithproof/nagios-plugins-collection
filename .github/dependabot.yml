version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: daily
    time: '04:00'
    timezone: UTC
  open-pull-requests-limit: 10
  versioning-strategy: increase
  # Pydantic pins its core exactly; keep the pair in one dependency update.
  groups:
    pydantic:
      patterns:
      - pydantic
      - pydantic-core
  rebase-strategy: auto
  labels:
  - dependencies
  - python
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: '04:10'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - ci
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: docker
  directory: /docker
  schedule:
    interval: daily
    time: '04:20'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - docker
  - bot
  commit-message:
    prefix: chore
    include: scope
