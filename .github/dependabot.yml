version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: daily
    time: '04:00'
    timezone: UTC
  open-pull-requests-limit: 10
  versioning-strategy: increase
  # aiohttp 3.14 requires multidict <7; reconsider with a compatible aiohttp.
  ignore:
  - dependency-name: multidict
    versions: [">=7.0.0"]
  rebase-strategy: auto
  labels:
  - dependencies
  - python
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: '04:10'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - ci
  - bot
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: docker
  directory: /docker
  schedule:
    interval: daily
    time: '04:20'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - docker
  - bot
  commit-message:
    prefix: chore
    include: scope
