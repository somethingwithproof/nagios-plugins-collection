[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nagios-plugins-collection"
version = "3.0.0"
description = "A collection of enterprise-grade Nagios plugins for monitoring various systems"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [
    {name = "Thomas Vincent", email = "thomasvincent@gmail.com"}
]
maintainers = [
    {name = "Thomas Vincent", email = "thomasvincent@gmail.com"}
]
keywords = ["nagios", "monitoring", "plugins", "health", "check"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Core dependencies needed by all plugins
    "httpx>=0.26.0",
]

# Optional dependencies grouped by functionality
[project.optional-dependencies]
mongodb = [
    "pymongo>=4.19.0",
]
ssh = [
    "paramiko>=5.1.0",
]
cli = [
    "typer>=0.27.3",
]
schema = [
    "pydantic>=2.14.2",
]
# prom and es add nothing beyond the core httpx dependency; they remain so
# existing installs that name them keep working.
prom = [
    "httpx>=0.26.0",
]
dns = [
    "dnspython>=2.9.1",
]
k8s = [
    "kubernetes>=37.0.1",
]
pg = [
    "psycopg[binary]>=3.1.18",
]
redis = [
    "redis>=7.4.0",
]
aws = [
    "boto3>=1.43.123",
]
es = [
    "httpx>=0.26.0",
]
all = [
    "nagios-plugins-collection[mongodb,ssh,cli,schema,prom,dns,k8s,pg,redis,aws,es]",
]

# Development tools are PEP 735 dependency groups locked in uv.lock; they are
# not published as package extras. `uv sync` installs the default dev group.
[dependency-groups]
test = [
    "cryptography>=46.0.0",
    "hypothesis>=6.170.12",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0",
]
lint = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]
type = [
    "mypy>=2.4.1",
    "pydantic>=2.14.2",
]
docs = [
    "docstr-coverage>=2.2.0",
    "myst-parser>=2.0.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=3.1.0",
]
security = [
    "bandit>=1.9.4",
    "pip>=26.2.2",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.0.0",
]
build = [
    "build>=1.0.0",
    "pip>=26.2.2",
    "pyyaml>=6.0",
    "setuptools>=84.2.1",
    "twine>=6.2.0",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "type"},
    {include-group = "docs"},
    {include-group = "security"},
    {include-group = "build"},
]

[tool.uv]
# Install only locked wheels; never build third-party source distributions.
no-build = true
# Build this project with the locked setuptools from the build group instead of
# resolving an unhashed backend into an isolated environment.
no-build-isolation-package = ["nagios-plugins-collection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "SIM" # flake8-simplify
]
ignore = [
  "E501",   # line length is handled by ruff format
]

[project.scripts]
# Standard plugins
check_website_status = "nagios_plugins.plugins.check_website_status:main"
check_component_status = "nagios_plugins.plugins.check_component_status:main"
check_mongodb_health = "nagios_plugins.plugins.check_mongodb_health:main"
check_ro_mounts = "nagios_plugins.plugins.check_ro_mounts:main"
# New enterprise plugins
check_tls_expiry = "nagios_plugins.plugins.check_tls_expiry:main"
check_prometheus_query = "nagios_plugins.plugins.check_prometheus_query:main"
check_http_sli = "nagios_plugins.plugins.check_http_sli:main"
check_dns_health = "nagios_plugins.plugins.check_dns_health:main"
check_k8s_node_status = "nagios_plugins.plugins.check_k8s_node_status:main"
check_postgres_replication_lag = "nagios_plugins.plugins.check_postgres_replication_lag:main"
check_queue_depth = "nagios_plugins.plugins.check_queue_depth:main"
check_oauth2_token = "nagios_plugins.plugins.check_oauth2_token:main"
check_redis_saturation = "nagios_plugins.plugins.check_redis_saturation:main"
check_log_errors = "nagios_plugins.plugins.check_log_errors:main"
check_cloud_budget = "nagios_plugins.plugins.check_cloud_budget:main"
check_backup_freshness = "nagios_plugins.plugins.check_backup_freshness:main"
check_aws_cloudwatch = "nagios_plugins.plugins.check_aws_cloudwatch:main"

# Legacy plugins
check_monghealth = "nagios_plugins.plugins.check_monghealth:main"
check_hadoop = "nagios_plugins.plugins.check_hadoop:main"
check_dig = "nagios_plugins.plugins.check_dig:main"
check_jobs = "nagios_plugins.plugins.check_jobs:main"

[project.urls]
"Homepage" = "https://github.com/somethingwithproof/nagios-plugins-collection"
"Bug Tracker" = "https://github.com/somethingwithproof/nagios-plugins-collection/issues"
"Documentation" = "https://nagios-plugins-collection.readthedocs.io/"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

# Relax checks in tests to allow incremental typing
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]
