[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nagios-plugins-collection"
version = "1.2.1"
description = "A collection of enterprise-grade Nagios plugins for monitoring various systems"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Thomas Vincent", email = "thomasvincent@gmail.com"}
]
maintainers = [
    {name = "Thomas Vincent", email = "thomasvincent@gmail.com"}
]
keywords = ["nagios", "monitoring", "plugins", "health", "check"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.26.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
mongodb = ["pymongo>=4.6.0"]
ssh = ["paramiko>=3.0.0"]
cli = ["typer>=0.9.0"]
schema = ["pydantic>=2.5.0"]
prom = ["httpx>=0.26.0"]
dns = ["dnspython>=2.6.1"]
k8s = ["kubernetes>=29.0.0"]
pg = ["psycopg[binary]>=3.1.18"]
redis = ["redis>=5.0.0"]
aws = ["boto3>=1.35.0"]
es = ["httpx>=0.26.0"]
legacy = ["pexpect>=4.9.0", "pynag"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "build>=1.0.0",
]
security = [
    "bandit>=1.7.5",
    "safety>=2.3.5",
]
all = [
    "nagios-plugins-collection[mongodb,ssh,cli,schema,legacy,dev,security,prom,dns,k8s,pg,redis,aws,es]",
]

[project.scripts]
check_website_status = "nagios_plugins.plugins.check_website_status:main"
check_component_status = "nagios_plugins.plugins.check_component_status:main"
check_mongodb_health = "nagios_plugins.plugins.check_mongodb_health:main"
check_ro_mounts = "nagios_plugins.plugins.check_ro_mounts:main"
check_tls_expiry = "nagios_plugins.plugins.check_tls_expiry:main"
check_prometheus_query = "nagios_plugins.plugins.check_prometheus_query:main"
check_http_sli = "nagios_plugins.plugins.check_http_sli:main"
check_dns_health = "nagios_plugins.plugins.check_dns_health:main"
check_k8s_node_status = "nagios_plugins.plugins.check_k8s_node_status:main"
check_postgres_replication_lag = "nagios_plugins.plugins.check_postgres_replication_lag:main"
check_queue_depth = "nagios_plugins.plugins.check_queue_depth:main"
check_oauth2_token = "nagios_plugins.plugins.check_oauth2_token:main"
check_redis_saturation = "nagios_plugins.plugins.check_redis_saturation:main"
check_log_errors = "nagios_plugins.plugins.check_log_errors:main"
check_cloud_budget = "nagios_plugins.plugins.check_cloud_budget:main"
check_backup_freshness = "nagios_plugins.plugins.check_backup_freshness:main"
check_monghealth = "nagios_plugins.plugins.check_monghealth:main"
check_hadoop = "nagios_plugins.plugins.check_hadoop:main"
check_dig = "nagios_plugins.plugins.check_dig:main"
check_jobs = "nagios_plugins.plugins.check_jobs:main"

[project.urls]
Homepage = "https://github.com/thomasvincent/nagios-plugins-collection"
"Bug Tracker" = "https://github.com/thomasvincent/nagios-plugins-collection/issues"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]

[tool.hatch.build.targets.wheel]
packages = ["src/nagios_plugins"]
